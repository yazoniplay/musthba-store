<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MUSHTBA Admin</title><link rel="stylesheet" href="admin.css"><style>.site-dialog{border:0;background:transparent;padding:0;max-width:min(440px,calc(100vw - 32px));width:100%}.site-dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(6px)}.site-dialog-card{background:#101010;color:#f5f5f5;border:1px solid #292929;padding:30px;box-shadow:0 30px 100px rgba(0,0,0,.45)}.site-dialog-card.danger{border-color:#3a2424}.site-dialog-card h2{margin:0 0 10px;font-size:28px;letter-spacing:-.05em}.site-dialog-card p{color:#999;line-height:1.6;font-size:13px;margin:0 0 24px}.site-dialog-actions{display:flex;justify-content:flex-end;gap:8px}.site-dialog-actions button{padding:12px 16px;border:1px solid #333;background:#171717;color:#fff;font-weight:700}.site-dialog-actions .primary{background:#fff;color:#050505;border-color:#fff}.site-dialog-card.danger .primary{background:#fff;color:#050505}</style></head><body><main class="shell">
<section id="loginView" class="login-card"><div class="eyebrow">MUSHTBA / ADMIN</div><h1>Store control.</h1><p>Manage the catalog, inventory and store content.</p><form id="loginForm"><input id="email" type="email" placeholder="Admin email" required><input id="password" type="password" placeholder="Password" required><button>Sign in</button><div id="loginError" class="error"></div></form></section>
<section id="adminView" hidden><header class="topbar"><div><div class="eyebrow">MUSHTBA</div><h1>Admin</h1><p id="adminEmail"></p></div><div class="top-actions"><a href="content.html">Content engine ↗</a><a href="index.html">View store ↗</a><button id="logoutBtn" class="ghost">Log out</button></div></header>
<div class="stats"><div><span>Total products</span><strong id="statProducts">0</strong></div><div><span>Live products</span><strong id="statActive">0</strong></div><div><span>Low stock</span><strong id="statLow">0</strong></div><div><span>Out of stock</span><strong id="statOut">0</strong></div></div>
<section class="panel"><div class="panel-head"><div><div class="eyebrow">CATALOG</div><h2>Products</h2><p class="panel-note">Drag products to set their storefront order.</p></div><button id="newProductBtn">+ Add product</button></div><div class="toolbar"><input id="catalogSearch" placeholder="Search products..."><select id="catalogFilter"><option value="all">All products</option><option value="Active">Active</option><option value="Draft">Draft</option><option value="low">Low stock</option><option value="out">Out of stock</option></select></div><div id="productList" class="product-list"></div></section>
<section class="panel"><div class="panel-head"><div><div class="eyebrow">STORE HEALTH</div><h2>Quick checks</h2></div></div><div id="healthGrid" class="health-grid"></div></section>
</section></main>
<dialog id="productDialog"><form id="productForm" class="product-form"><div class="dialog-head"><div><div class="eyebrow">PRODUCT</div><h2 id="dialogTitle">Add product</h2></div><button type="button" id="closeDialog" class="icon">×</button></div><input id="productId" type="hidden">
<div class="two"><label>Name<input id="productName" required></label><label>Slug<input id="productSlug" placeholder="auto-generated"></label></div><div class="two"><label>Brand<select id="productBrand"><option>Nike</option><option>Under Armour</option></select></label><label>Category<input id="productCategory" value="Collection"></label></div><div class="two"><label>Price (kr)<input id="productPrice" type="number" min="0" step="0.01" required></label><label>Stock<input id="productStock" type="number" min="0" required></label></div><div class="two"><label>Status<select id="productStatus"><option>Active</option><option>Draft</option></select></label><label>Badge<select id="productBadge"><option value="">None</option><option>Featured</option><option>New</option><option>Best Seller</option></select></label></div><label>Description<textarea id="productDescription" rows="4" placeholder="Short, useful product description"></textarea>
<div class="upload-box"><div><b>Product images</b><small>Upload directly from your device. The first image is the main storefront image.</small></div><label class="upload-button" for="productImageFiles">Choose images<input id="productImageFiles" type="file" accept="image/jpeg,image/png,image/webp,image/avif" multiple></label><div id="imagePreview" class="image-preview"></div></div>
<label>Sizes <small>comma separated</small><input id="productSizes" placeholder="S, M, L, XL"></label><label class="check"><input id="productFeatured" type="checkbox"> Featured product</label><div class="form-actions"><button type="button" id="cancelProduct" class="ghost">Cancel</button><button id="saveProductBtn">Save product</button></div><div id="formError" class="error"></div></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js"></script></body></html>
