<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MUSTHBA Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="shell">
    <section id="loginView" class="login-card">
      <div class="eyebrow">MUSTHBA / ADMIN</div>
      <h1>Store control.</h1>
      <p>Sign in to manage products, stock and orders.</p>
      <form id="loginForm">
        <input id="email" type="email" placeholder="Admin email" required>
        <input id="password" type="password" placeholder="Password" required>
        <button>Sign in</button>
        <div id="loginError" class="error"></div>
      </form>
    </section>

    <section id="adminView" hidden>
      <header class="topbar">
        <div><span class="eyebrow">MUSTHBA</span><h1>Admin</h1></div>
        <div class="top-actions"><a href="index.html">View store</a><button id="logoutBtn" class="ghost">Log out</button></div>
      </header>

      <div class="stats">
        <div><span>Products</span><strong id="statProducts">0</strong></div>
        <div><span>Active</span><strong id="statActive">0</strong></div>
        <div><span>Low stock</span><strong id="statLow">0</strong></div>
        <div><span>Orders</span><strong id="statOrders">0</strong></div>
      </div>

      <section class="panel">
        <div class="panel-head">
          <div><div class="eyebrow">CATALOG</div><h2>Products</h2></div>
          <button id="newProductBtn">+ Add product</button>
        </div>
        <div id="productList" class="product-list"></div>
      </section>

      <section class="panel">
        <div class="panel-head"><div><div class="eyebrow">ORDERS</div><h2>Recent orders</h2></div></div>
        <div id="orderList" class="order-list"></div>
      </section>
    </section>
  </main>

  <dialog id="productDialog">
    <form id="productForm" class="product-form">
      <div class="dialog-head"><div><div class="eyebrow">PRODUCT</div><h2 id="dialogTitle">Add product</h2></div><button type="button" id="closeDialog" class="icon">×</button></div>
      <input id="productId" type="hidden">
      <div class="two">
        <label>Name<input id="productName" required></label>
        <label>Slug<input id="productSlug" required></label>
      </div>
      <div class="two">
        <label>Brand<select id="productBrand"><option>Nike</option><option>Under Armour</option></select></label>
        <label>Category<input id="productCategory" value="Collection"></label>
      </div>
      <div class="two">
        <label>Price (kr)<input id="productPrice" type="number" min="0" step="0.01" required></label>
        <label>Stock<input id="productStock" type="number" min="0" required></label>
      </div>
      <div class="two">
        <label>Status<select id="productStatus"><option>Active</option><option>Draft</option></select></label>
        <label>Badge<select id="productBadge"><option>None</option><option>Featured</option><option>New</option><option>Best Seller</option></select></label>
      </div>
      <label>Description<textarea id="productDescription" rows="4"></textarea></label>
      <label>Image URLs <small>one per line</small><textarea id="productImages" rows="3" placeholder="https://..."></textarea></label>
      <label>Sizes <small>comma separated</small><input id="productSizes" placeholder="S, M, L, XL"></label>
      <label class="check"><input id="productFeatured" type="checkbox"> Featured product</label>
      <div class="form-actions"><button type="button" id="cancelProduct" class="ghost">Cancel</button><button>Save product</button></div>
      <div id="formError" class="error"></div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
